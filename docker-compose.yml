services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.3
    container_name: cadvisor
    network_mode: "host"
    privileged: true
    pid: "host"
    command:
      - --port=8081
      - --docker_only=true
      - --housekeeping_interval=2s
      - --disable_metrics=percpu,sched,tcp,udp,diskIO,hugetlb,referenced_memory
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /cgroup:/cgroup:ro
      - /dev/mapper:/dev/mapper:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
