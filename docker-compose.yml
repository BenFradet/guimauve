services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.3
    container_name: cadvisor
    command: ["-port", "8081"]
    network_mode: "host"
    privileged: true
    pid: "host"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /cgroup:/cgroup:ro
      - /dev/mapper:/dev/mapper:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
